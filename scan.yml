name: sp500-scan

on:
  schedule:
    - cron: "15,45 13-21 * * 1-5"   # hafta içi, ABD seansı civarı (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu"
        type: choice
        options: [auto, test, intraday, eod]
        default: auto

permissions:
  contents: write

concurrency:
  group: insider-watch   # insider bot ile aynı anda çalışmasın
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: S&P 500 taraması
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py ${{ inputs.mode || 'auto' }}
      - name: Durumu kaydet
        if: ${{ inputs.mode != 'test' }}
        run: |
          git config user.name "insider-bot"
          git config user.email "insider-bot@users.noreply.github.com"
          git add scan_state.json
          git diff --cached --quiet || (git commit -m "tarama durumu" && git pull --rebase && git push)
