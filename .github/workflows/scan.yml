name: sp500-scan

on:
  schedule:
    - cron: "15,45 13-21 * * 1-5"   # gün içi tarama + gün sonu özeti (UTC)
    - cron: "0 6 * * 2-6"           # 09:00 İstanbul: kapanış sonrası raporu
    - cron: "0 13 * * 1-5"          # 16:00 İstanbul: piyasa özeti + açılış öncesi
    - cron: "0 6 * * 1"             # Pazartesi 09:00: haftanın bilanço takvimi
    - cron: "0 7 * * 6"             # Cumartesi 10:00: sinyal karnesi
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu"
        type: choice
        options: [auto, test, intraday, eod, afterhours, premarket, market, weekly, scorecard]
        default: auto

permissions:
  contents: write

concurrency:
  group: insider-watch   # insider bot ile aynı anda çalışmasın
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: S&P 500 taraması
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 6 * * 2-6")  MODE=afterhours ;;
              "0 13 * * 1-5") MODE=premarket ;;
              "0 6 * * 1")    MODE=weekly ;;
              "0 7 * * 6")    MODE=scorecard ;;
              *)              MODE=auto ;;
            esac
          elif [ "$MODE" = "afterhours" ] || [ "$MODE" = "premarket" ]; then
            MODE="$MODE-now"   # elle çalıştırmada her zaman rapor üret
          fi
          python scanner.py "$MODE"
      - name: Durumu kaydet
        if: ${{ inputs.mode != 'test' }}
        run: |
          git config user.name "insider-bot"
          git config user.email "insider-bot@users.noreply.github.com"
          git add scan_state.json
          git diff --cached --quiet || (git commit -m "tarama durumu" && git pull --rebase && git push)
