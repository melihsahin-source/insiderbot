name: insider-watch

on:
  schedule:
    - cron: "*/30 * * * 1-5"   # hafta içi her 30 dakikada bir (UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece Telegram test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: insider-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bildirimleri kontrol et
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py ${{ inputs.test && '--test' || '' }}
      - name: Durumu kaydet
        if: ${{ !inputs.test }}
        run: |
          git config user.name "insider-bot"
          git config user.email "insider-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state güncellendi" && git push)
